name: TrocSkillHub UI CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_front-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build --if-present
        env:
          VITE_API_BASE_URL: /api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-trocskillhub
          path: |
            app_front-end/dist
            !app_front-end/dist/**/*.md

  test:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: app_front-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install firefox --with-deps

      - name: Run tests
        run: npm run test -- --run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-trocskillhub
          path: app_front-end/output/test/code-coverage.html

  deploy:
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  needs: test
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: app_front-end
      run: npm ci

    - name: Build frontend
      working-directory: app_front-end
      run: npm run build
      env:
        VITE_API_BASE_URL: /api

    - name: Add htaccess for React routing
      run: |
        cat > app_front-end/dist/.htaccess <<'EOF'
        RewriteEngine On
        RewriteBase /

        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
        EOF

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Deploy to OVH
      run: |
        sshpass -p "${{ secrets.OVH_PASSWORD }}" scp \
          -P "${{ secrets.OVH_PORT || 22 }}" \
          -o StrictHostKeyChecking=no \
          -r app_front-end/dist/* app_front-end/dist/.htaccess \
          "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/www/"