name: trocskillhub UI CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app_front-end
        run: npm ci

      - name: Run linter
        working-directory: app_front-end
        run: npm run lint

      - name: Build application
        working-directory: app_front-end
        run: npm run build --if-present

      - name: Run tests
        working-directory: app_front-end
        run: npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-trocskillhub
          path: app_front-end/dist

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-trocskillhub
          path: app_front-end/output/test/code-coverage.html
